name: Claude PR Review

# The review runs on CI's completion rather than watching checks from inside itself (which would
# include itself and deadlock — pablo-tech/pilos#10). It approves and enables auto-merge; the
# `protect-main` ruleset then merges only once every required check is green.
#
# vars.AUTOPILOT gates the merge: `on` enables auto-merge after approval (unless the pull request
# is labeled `hold`), `dry-run` (or unset) stops at approval, `off` skips the review.
#
# push-audit stays here: it is an after-the-fact read of a direct push to main, not part of the
# pull-request pipeline the shared workflow implements.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: promontory-studio/pedalion/.github/workflows/review.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      mode: ${{ vars.AUTOPILOT || 'dry-run' }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      ci-conclusion: ${{ github.event.workflow_run.conclusion }}
      head-branch: ${{ github.event.workflow_run.head_branch }}
      # Deliberately empty for now: the App's private key lives in plover-keys, and the global
      # rule is that a plover-keys credential does not go on a public repository. Without an App
      # the host approves and stops, because a merge pushed with GITHUB_TOKEN starts no release.
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      # `retarget-base` is unset on purpose: main is the only long-lived branch here, so a pull
      # request raised against it is already where it belongs.

  push-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-base-action@2d6abe4aa8adacaa322e24a040787cf155cf1d09 # v0.0.63
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-5"
          allowed_tools: "Read,Grep,Glob,Bash(git show:*),Bash(gh api repos/*/commits/*/comments:*)"
          prompt: |
            A commit was just pushed directly to main, bypassing PR review.
            Review its diff with `git show HEAD`. Only if you find a blocking
            correctness bug, post a commit comment explaining it with
            `gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="..."`.
            Say nothing and take no action if the commit looks fine — this is
            an audit pass, not a gate, since the commit is already merged.

  notify-failure:
    needs: [review, push-audit]
    if: always() && contains(needs.*.result, 'failure')
    uses: promontory-studio/pedalion/.github/workflows/notify-failure.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    # Files in this repo's own tracker, not in the shared inbox: nothing here is
    # user-derived, so there is nothing to keep out of a public issue.
    with:
      title: Claude PR review workflow failed
      context: The review automation itself broke, so pull requests are going unreviewed until it is fixed.
      assignee: pablo-tech
