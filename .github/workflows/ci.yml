name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        package: [neuro-pil, akesi-pil]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
      # vitest transpiles without type-checking, so nothing in this repo ran the compiler until
      # akesi-pil gained a `check` script. `--if-present` keeps neuro-pil, which has no tsconfig, a
      # no-op rather than a failure.
      - run: npm run check --if-present
        working-directory: ${{ matrix.package }}

  dco:
    # Every commit needs a Signed-off-by trailer — the Developer Certificate of Origin, see
    # CONTRIBUTING.md. Runs on push as well, where it prints "nothing to check" and exits 0: a
    # required check that reports SKIPPED on a push blocks the branch forever, per the note below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit signed off
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request — nothing to check."
            exit 0
          fi
          fail=0
          for sha in $(git log --no-merges --format=%H "$BASE_SHA..$HEAD_SHA"); do
            author=$(git log -1 --format=%an "$sha")
            # Bots certify nothing and hold no copyright, and a check they can never satisfy only
            # teaches everyone to bypass it. Matched by name suffix so new bots need no edit here.
            case "$author" in
              *'[bot]') echo "skip   $sha  $author"; continue ;;
            esac
            if git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok     $sha  $author"
            else
              echo "MISSING Signed-off-by: $sha  $author  $(git log -1 --format=%s "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Add it with 'git commit -s', or across a branch already written with"
            echo "'git rebase --signoff origin/main'. See CONTRIBUTING.md."
            exit 1
          fi

  autopilot-guard:
    # The rules it enforces are in .github/autopilot.json. Which pull requests it applies to is an
    # input, not a job-level `if:`: a required check that reports SKIPPED blocks the merge forever.
    if: github.event_name == 'pull_request'
    uses: promontory-studio/pedalion-ci/.github/workflows/guard.yml@6c2d307ada45c3202c2c395b2ac46056c47a40bf # v1.3.0
    with:
      base-ref: ${{ github.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      authors: pedalion-ci[bot],dependabot[bot]
      pr-author: ${{ github.event.pull_request.user.login }}
      # There is no root manifest here, so the host's default `npm ci` has nothing to install.
      install: npm install --prefix neuro-pil && npm install --prefix akesi-pil

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bump both packages past any version whose tag already exists
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "$(node -p "require('./neuro-pil/package.json').version")"
          # A tag left behind by a release that failed after tagging would make `git tag` below fail
          # on every run after it, wedging releases permanently. Skip past it instead.
          patch=$((patch + 1))
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          (cd neuro-pil && npm version "$new_version" --no-git-tag-version)
          (cd akesi-pil && npm version "$new_version" --no-git-tag-version)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neuro-pil/package.json akesi-pil/package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
      - name: Publish to npm
        run: |
          (cd neuro-pil && npm publish --provenance --access public)
          (cd akesi-pil && npm publish --provenance --access public)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
